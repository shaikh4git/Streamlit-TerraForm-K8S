
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terraform-deployer-role
  namespace: streamlit-terraform

rules:
  # Manage Streamlit Deployment
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Manage Streamlit Service
  - apiGroups: [""]
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
